<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Lead Triage Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090d16; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 28px; width: 100%; max-width: 460px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #34d399; background: rgba(6, 78, 59, 0.4); border: 1px solid #065f46; padding: 4px 8px; border-radius: 4px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
    p.desc { font-size: 12px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input, textarea { width: 100%; background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 10px 12px; color: #ffffff; font-size: 13px; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus { border-color: #10b981; }
    button { width: 100%; background: #10b981; color: #020617; font-weight: 700; font-size: 14px; padding: 12px; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 6px; }
    button:hover { background: #059669; }
    button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .result-box { display: none; margin-top: 20px; padding: 16px; background: #020617; border: 1px solid #1e293b; border-radius: 8px; font-size: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .status-tag { color: #34d399; font-family: monospace; font-weight: 700; }
    .urgency-high { color: #f43f5e; font-weight: 700; font-size: 13px; }
    .urgency-mid { color: #fbbf24; font-weight: 700; font-size: 13px; }
    .reply-box { margin-top: 10px; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #1e293b; color: #e2e8f0; font-style: italic; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Live Edge Engine</div>
    <h1>Inbound Lead Processor</h1>
    <p class="desc">Autonomous classification, urgency scoring, and reply generation powered by Groq & Supabase.</p>

    <form id="leadForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Virat Kohli">
      </div>

      <div class="form-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" required placeholder="kohli@one8.com">
      </div>

      <div class="form-group">
        <label for="message">Inquiry / Business Need</label>
        <textarea id="message" rows="3" required placeholder="Describe what your team needs automated..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Process Inbound Lead</button>
    </form>

    <div id="output" class="result-box">
      <div class="row">
        <span style="color: #94a3b8;">Status</span>
        <span class="status-tag">Processed 200 OK</span>
      </div>
      <div class="row">
        <span style="color: #94a3b8;">Classified Category:</span>
        <span id="outCategory" style="font-weight: 600; color: #ffffff;"></span>
      </div>
      <div class="row">
        <span style="color: #94a3b8;">Normalized Urgency:</span>
        <span id="outUrgency"></span>
      </div>
      <div style="margin-top: 8px;">
        <span style="color: #94a3b8; display: block; margin-bottom: 4px;">Generated Draft Response:</span>
        <p id="outReply" class="reply-box"></p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const output = document.getElementById('output');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing Payload...';
      output.style.display = 'none';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Server processing error');

        const lead = json.data;
        document.getElementById('outCategory').innerText = lead.category;
        
        const urgencyEl = document.getElementById('outUrgency');
        urgencyEl.innerText = `${lead.urgency_score} / 10`;
        urgencyEl.className = lead.urgency_score >= 8 ? 'urgency-high' : 'urgency-mid';

        document.getElementById('outReply').innerText = lead.draft_reply;
        output.style.display = 'block';
        form.reset();
      } catch (err) {
        alert('Pipeline Error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Process Inbound Lead';
      }
    });
  </script>
</body>
</html>
